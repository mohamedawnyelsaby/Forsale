<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forsale — The world's homes, in Pi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{--bg:#f7f5f0;--surf:#fff;--ink:#0f1b2d;--mut:#667085;--line:#e7e2d8;--navy:#0a1730;--gold:#b8893b;--gold2:#e3c07a;--pi:#6f3ff5;--r:22px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:Cairo,Inter,sans-serif}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.02em}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .serif{font-family:Cairo,serif;letter-spacing:0}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:1240px;margin:auto;padding-inline:24px}
/* nav */
nav{position:absolute;inset:0 0 auto;z-index:10;padding-top:env(safe-area-inset-top)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:78px}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-family:Fraunces,serif;font-size:26px;font-weight:700}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;color:var(--navy);font-style:normal;font-size:19px}
.links{display:flex;gap:28px;color:#ffffffcc;font-size:15px}.links a{color:inherit;text-decoration:none}.links a:hover{color:#fff}
.nr{display:flex;gap:10px;align-items:center}
.pill{border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px}
.glass{background:#ffffff1f;color:#fff;border:1px solid #ffffff40;backdrop-filter:blur(12px)}
.pi{background:var(--pi);color:#fff}
/* hero */
.hero{position:relative;min-height:680px;color:#fff;overflow:hidden;display:flex;align-items:center}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0a173066,#0a173000 40%,#0a1730cc)}
.hero .wrap{position:relative;z-index:2;padding-top:90px;padding-bottom:70px;width:100%}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:600}
[dir=rtl] .eyebrow{letter-spacing:0}
.hero h1{font-size:clamp(40px,7vw,84px);line-height:1.02;margin:14px 0 18px;max-width:860px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold2),#fff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:19px;color:#ffffffd0;max-width:560px;line-height:1.6}
.sbar{margin-top:34px;background:#fff;color:var(--ink);border-radius:26px;padding:10px;display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:6px;max-width:960px;box-shadow:0 30px 80px #0a173066}
.sbar label{padding:10px 18px;display:block;border-inline-end:1px solid var(--line)}
.sbar label:nth-child(3){border:0}
.sbar small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
[dir=rtl] .sbar small{letter-spacing:0}
.sbar input,.sbar select{border:0;outline:0;background:none;font:inherit;font-size:16px;font-weight:500;width:100%;color:var(--ink);margin-top:3px}
.go{background:var(--navy);color:#fff;border-radius:18px;padding:0 30px;font-weight:600;font-size:16px}
.go:hover{background:#13264a}
.stats{display:flex;gap:48px;margin-top:40px;flex-wrap:wrap}
.stats b{display:block;font-family:Fraunces,serif;font-size:34px}.stats span{color:#ffffffaa;font-size:14px}
/* sections */
section{padding:84px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:32px}
.head h2{font-size:clamp(30px,4vw,46px);line-height:1.1}.head p{color:var(--mut);margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:500;color:var(--ink)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:26px}
.card{background:var(--surf);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:.3s}
.card:hover{transform:translateY(-6px);box-shadow:0 30px 60px #0a173022}
.ph{position:relative;height:230px;overflow:hidden}
.ph svg,.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:.6s}
.card:hover .ph svg,.card:hover .ph img{transform:scale(1.06)}
.badge{position:absolute;top:14px;inset-inline-start:14px;background:#ffffffee;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.badge:before{content:"✓";color:#fff;background:#0f9d6b;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px}
.heart{position:absolute;top:12px;inset-inline-end:12px;width:38px;height:38px;border-radius:50%;background:#ffffffee;font-size:18px;color:var(--ink)}
.heart.on{color:#e11d48}
.cb{padding:20px 22px 22px}
.price{font-family:Fraunces,serif;font-size:28px;font-weight:700}.price span{color:var(--gold)}
.cb h3{font-size:19px;margin:6px 0 4px;font-family:Inter,sans-serif;font-weight:600;letter-spacing:0}
[dir=rtl] .cb h3{font-family:Cairo}
.loc{color:var(--mut);font-size:14px}
.spec{display:flex;gap:18px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:#344054}
/* features */
.dark{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.dark:before{content:"";position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(#b8893b44,transparent 65%);top:-250px;inset-inline-end:-150px}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;position:relative}
.f{border:1px solid #ffffff22;border-radius:var(--r);padding:30px;background:#ffffff0a}
.f .ic{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;font-size:24px;color:var(--navy);margin-bottom:20px}
.f h3{font-size:22px;margin-bottom:10px}.f p{color:#ffffffaa;line-height:1.65}
/* ai */
.ai{display:grid;grid-template-columns:1fr 1.1fr;gap:50px;align-items:center}
.ai h2{font-size:clamp(30px,4vw,48px);line-height:1.1;margin-bottom:14px}.ai p{color:var(--mut);line-height:1.7}
.chat{background:var(--surf);border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 70px #0a173018;overflow:hidden}
.ch{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-weight:600}
.ch i{width:10px;height:10px;border-radius:50%;background:#0f9d6b}
#log{height:250px;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.m{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.6;font-size:15px}
.m.u{background:var(--navy);color:#fff;align-self:flex-end;border-end-end-radius:4px}
.m.a{background:#f1ede3;align-self:flex-start;border-end-start-radius:4px}
.sug{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px}.sug button{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--mut)}
.in{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}
.in input{flex:1;border:1px solid var(--line);border-radius:14px;padding:13px 16px;font:inherit;outline:0;background:var(--bg)}
.in button{background:var(--gold);color:var(--navy);font-weight:700;border-radius:14px;padding:0 22px}
/* modal */
dialog{border:0;border-radius:28px;width:min(860px,94vw);padding:0;overflow:hidden;background:var(--surf);color:var(--ink);margin:auto}
dialog::backdrop{background:#0a1730b3;backdrop-filter:blur(6px)}
.dm{display:grid;grid-template-columns:1.2fr 1fr}.dm .ph{height:100%;min-height:420px}
.dd{padding:34px}.dd h2{font-size:30px;margin:8px 0}.dd .price{font-size:36px;margin:14px 0}
.sp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.sp div{background:var(--bg);border-radius:14px;padding:12px;text-align:center}.sp b{display:block;font-size:20px}.sp small{color:var(--mut)}
.btn{display:block;width:100%;border-radius:16px;padding:16px;font-weight:700;font-size:16px;margin-top:10px}
.x{position:absolute;top:14px;inset-inline-end:14px;width:40px;height:40px;border-radius:50%;background:#fff;z-index:3;font-size:18px}
footer{background:#07101f;color:#ffffff99;padding:44px 0;font-size:14px}footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:14px 22px;border-radius:16px;display:none;z-index:99;font-weight:500;box-shadow:0 20px 50px #0a173066}
@media(max-width:900px){.links{display:none}.sbar{grid-template-columns:1fr}.sbar label{border:0;border-bottom:1px solid var(--line)}.go{padding:16px}.fg,.ai,.dm{grid-template-columns:1fr}.dm .ph{min-height:260px}.hero{min-height:760px}.grid{grid-template-columns:1fr}}
</style>
</head>

<nav><div class="wrap">
  <div class="logo"><i>F</i>Forsale</div>

<section class="dark" id="why"><div class="wrap">

</div></section>

<section id="ai"><div class="wrap ai">

  <div class="chat"><div class="ch"><i></i>Forsale AI</div><div id="log"></div>
    <div class="sug" id="sug"></div>
    <div class="in"><input id="aq" data-ph="aiph"><button id="send" data-i="send"></button></div></div>
</div></section>

<footer><div class="wrap"><div class="logo" style="font-size:20px"><i style="width:28px;height:28px;font-size:15px">F</i>Forsale</div><div>© 2026 Forsale · Built on Pi Network</div></div></footer>

<dialog id="dlg"><button class="x" onclick="dlg.close()">✕</button><div class="dm" id="dm"></div></dialog>

const $=id=>document.getElementById(id);
const I={
en:{n1:'Properties',n2:'Why Forsale',n3:'AI Advisor',login:'Connect Pi',eyebrow:'The global property marketplace',h1:'Find your place <em>anywhere</em> on Earth.',sub:'Verified homes, villas and commercial spaces in 190+ countries — bought and sold directly in Pi.',where:'Where',wph:'City or country',type:'Type',any:'Any type',apt:'Apartment',villa:'Villa',com:'Commercial',land:'Land',budget:'Budget',anyp:'Any price',search:'Search',s1:'Countries',s2:'Properties',s3:'Verified owners',feat:'Featured properties',featp:'Hand-picked homes from around the world.',all:'All',why:'Built for a borderless market',f1t:'Pay in Pi',f1:'Settle purchases and listing fees in Pi — fast, borderless, no banks in the middle.',f2t:'AI property advisor',f2:'Describe your dream home in any language and get matched instantly.',f3t:'Verified listings',f3:'Every owner and agent is identity-checked before a listing goes live.',aiE:'Forsale AI',aiH:'Tell us what you dream of. We’ll find it.',aiP:'Ask in plain language — budget, city, style. Our advisor compares listings and explains the trade-offs.',aiph:'e.g. a villa by the sea under 500k π',send:'Send',hi:'Hi! I\'m your Forsale advisor. What kind of place are you looking for?',s_1:'Villa by the sea',s_2:'Best investment',s_3:'Cheapest apartment',beds:'Beds',baths:'Baths',area:'m²',buy:'Buy with Pi',offer:'Make an offer',list:'List your property',none:'No properties match.',login1:'Connect Pi first (open in Pi Browser)',ok:'Done ✔',cancel:'Cancelled',err:'Something went wrong',offerOk:'Offer sent to the owner',verified:'Verified'},

const PAL=[['#16294d','#e58b5b','#f9d9a6'],['#0c3a4d','#f0a56e','#ffe8c4'],['#3a2a58','#f07f6a','#ffd4a3'],['#0f3b45','#8fcdbd','#f6f0dc'],['#262b45','#ee7f4f','#ffd7a8'],['#0a3b30','#d6a766','#fff0cf']];

 let s=`<defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".65" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#${g})"/><circle cx="${w*.7}" cy="${h*.52}" r="${h*.14}" fill="${c}" opacity=".9"/>`;

const T=k=>I[lang][k];
function applyLang(){
 const d=document.documentElement;d.lang=lang;d.dir=lang==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=T(e.dataset.i));
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T(e.dataset.ph));
 $('lang').textContent=lang==='ar'?'English':'العربية';
 if(user)$('login').textContent='@'+user.username;
 $('chips').innerHTML=[['',T('all')],['villa',T('villa')],['apt',T('apt')],['com',T('com')],['land',T('land')]].map(([k,v])=>`<button class="chip ${cat===k?'on':''}" data-k="${k}">${v}</button>`).join('');
 $('sug').innerHTML=[1,2,3].map(n=>`<button>${T('s_'+n)}</button>`).join('');
 $('log').innerHTML=`<div class="m a">${T('hi')}</div>`;
 render();
}
const fmt=n=>n.toLocaleString(lang==='ar'?'ar-EG':'en-US');
function render(){
 const q=$('q').value.trim().toLowerCase(),t=$('t').value||cat,p=+$('p').value;
 const r=L.filter(x=>(!q||(x.t.en+x.t.ar+x.c.en+x.c.ar).toLowerCase().includes(q))&&(!t||x.ty===t)&&(!p||x.p<=p));
 $('grid').innerHTML=r.map(x=>`<article class="card" data-id="${x.id}"><div class="ph">${x.photo?`<img src="${x.photo}" alt="" onerror="this.outerHTML=window.scene(L.find(v=>v.id==${x.id}))">`:scene(x)}<span class="badge">${T('verified')}</span><button class="heart ${favs.has(x.id)?'on':''}" data-h="${x.id}">♥</button></div>
 <div class="cb"><div class="price">${fmt(x.p)} <span>π</span></div><h3>${x.t[lang]}</h3><div class="loc">📍 ${x.c[lang]}</div>
 <div class="spec"><span>🛏 ${x.b} ${T('beds')}</span><span>🛁 ${x.ba}</span><span>📐 ${fmt(x.a)} ${T('area')}</span></div></div></article>`).join('')||`<p>${T('none')}</p>`;
}
window.scene=scene;window.L=L;
const toast=m=>{const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)};
$('lang').onclick=()=>{lang=lang==='en'?'ar':'en';applyLang()};
['q','t','p'].forEach(i=>$(i).addEventListener('input',render));
$('go').onclick=()=>{render();$('browse').scrollIntoView()};
$('chips').onclick=e=>{if(e.target.dataset.k!==undefined){cat=e.target.dataset.k;$('t').value='';applyLang()}};
$('grid').onclick=e=>{
 const h=e.target.closest('[data-h]');if(h){e.stopPropagation();const i=+h.dataset.h;favs.has(i)?favs.delete(i):favs.add(i);return render()}
 const c=e.target.closest('.card');if(c)open(+c.dataset.id)};
function open(id){const x=L.find(v=>v.id===id);
 $('dm').innerHTML=`<div class="ph">${scene(x,600,520,'d')}</div><div class="dd"><span class="badge" style="position:static;display:inline-flex">${T('verified')}</span><h2>${x.t[lang]}</h2><div class="loc">📍 ${x.c[lang]}</div><div class="price">${fmt(x.p)} <span>π</span></div>
 <div class="sp"><div><b>${x.b}</b><small>${T('beds')}</small></div><div><b>${x.ba}</b><small>${T('baths')}</small></div><div><b>${fmt(x.a)}</b><small>${T('area')}</small></div></div>
 <button class="btn pi" onclick="buy(${x.id})">π ${T('buy')}</button><button class="btn" style="background:var(--bg)" onclick="dlg.close();toast(T('offerOk'))">${T('offer')}</button></div>`;
 dlg.showModal()}

/* Pi Network */
try{Pi.init({version:'2.0',sandbox:true})}catch(e){} // set sandbox:false for production
const J=b=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const onInc=p=>fetch('/api/pi/complete',J({paymentId:p.identifier,txid:p.transaction&&p.transaction.txid}));
$('login').onclick=async()=>{try{const a=await Pi.authenticate(['username','payments'],onInc);user=a.user;$('login').textContent='@'+user.username}catch(e){toast(T('login1'))}};
window.buy=id=>{const x=L.find(v=>v.id===id);if(!user)return toast(T('login1'));
 Pi.createPayment({amount:x.p,memo:x.t.en,metadata:{listingId:id}},{
  onReadyForServerApproval:pid=>fetch('/api/pi/approve',J({paymentId:pid})),
  onReadyForServerCompletion:(pid,txid)=>fetch('/api/pi/complete',J({paymentId:pid,txid})).then(()=>{dlg.close();toast(T('ok'))}),
  onCancel:()=>toast(T('cancel')),onError:()=>toast(T('err'))})};

/* AI */
async function ask(q){if(!q)return;const lg=$('log');lg.innerHTML+=`<div class="m u">${q.replace(/</g,'&lt;')}</div>`;$('aq').value='';
 try{const r=await fetch('/api/ai',J({q,listings:L.map(x=>({id:x.id,title:x.t.en,city:x.c.en,type:x.ty,price_pi:x.p,beds:x.b,area:x.a}))}));const d=await r.json();lg.innerHTML+=`<div class="m a">${d.text.replace(/</g,'&lt;')}</div>`}
 catch(e){lg.innerHTML+=`<div class="m a">${T('err')}</div>`}lg.scrollTop=1e9}
$('send').onclick=()=>ask($('aq').value.trim());
$('aq').onkeydown=e=>{if(e.key==='Enter')ask(e.target.value.trim())};
$('sug').onclick=e=>{if(e.target.tagName==='BUTTON')ask(e.target.textContent)};
applyLang();
</script>
</body></html>

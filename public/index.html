<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Forsale — The world's homes, in Pi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{--bg:#fff;--surf:#fff;--ink:#1d1409;--mut:#85532c;--line:#f5e4d3;--gold:#E55B00;--gold2:#FFB21A;--pi:#E55B00;--r:22px;
--btn:linear-gradient(135deg,#F2750A,#E55B00);--btnink:#fff;--acc:linear-gradient(135deg,#FFE8D3,#FFD3AD);--accink:#B84700;
--sec:#fff8f1;--sect:#1d1409;--tbg:#1d1409;--glass:#ffffffee;--sh:0 16px 36px #e55b0026;
--hov:linear-gradient(180deg,#ffffff00 55%,#fff);--ftr:#fff4e8;--ftrc:#85532c;--ts:none;
--htx:#1d1409;--hsub:#5f3b1e;--gl:#ffffffd0;--glb:#f5e4d3;--em:linear-gradient(90deg,#D94F00,#F2750A);--ey:#E55B00;
--fb:#f5e4d3;--fbg:#fff;--fp:#85532c;--glow:#ffd9b84d;--nvbg:#ffffffe8}
[data-theme=dark]{--bg:#07171B;--surf:#0E2A30;--ink:#ecf9f7;--mut:#8fb9bb;--line:#16414a;--gold:#e8c987;--gold2:#e8c987;
--btn:linear-gradient(135deg,#EFD296,#D9B466);--btnink:#06242a;--acc:linear-gradient(135deg,#ecd08e,#c1954a);--accink:#06242a;
--sec:linear-gradient(135deg,#0c2e35,#12454e);--sect:#fff;--tbg:#16414a;--glass:#0d2a30ee;--sh:0 24px 50px #0009;
--hov:linear-gradient(180deg,#00000066,#00000000 40%,#06171bf2);--ftr:#04100f;--ftrc:#ffffff99;--ts:none;
--htx:#fff;--hsub:#ffffffcc;--gl:#ffffff1f;--glb:#ffffff40;--em:linear-gradient(90deg,#e8c987,#fff);--ey:#e8c987;
--fb:#ffffff22;--fbg:#ffffff0a;--fp:#ffffffaa;--glow:#c1954a44;--nvbg:#06171be8;color-scheme:dark}
body{transition:background .3s,color .3s}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[dir=rtl] body{font-family:Cairo,Inter,sans-serif}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.02em}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3,[dir=rtl] .serif{font-family:Cairo,serif;letter-spacing:0}
button{font:inherit;cursor:pointer;border:0}
.wrap{max-width:1240px;margin:auto;padding-inline:24px}
/* nav */
nav{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top);background:var(--nvbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:72px;gap:8px}
.logo{display:flex;align-items:center;gap:10px;color:var(--htx);font-family:Fraunces,serif;font-size:26px;font-weight:700}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:var(--accink);font-style:normal;font-size:19px}
.links{display:flex;gap:28px;color:var(--hsub);font-size:15px;font-weight:500}.links a{color:inherit;text-decoration:none}.links a:hover{color:var(--htx)}
.nr{display:flex;gap:10px;align-items:center}
.pill{border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px}
.glass{background:var(--gl);color:var(--htx);border:1px solid var(--glb);backdrop-filter:blur(12px)}
.pi{background:var(--pi);color:#fff}
/* hero */
.hero{position:relative;min-height:680px;color:var(--htx);overflow:hidden;display:flex;align-items:center}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";position:absolute;inset:0;background:var(--hov)}
.hero .wrap{text-shadow:var(--ts);position:relative;z-index:2;padding-top:90px;padding-bottom:70px;width:100%}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ey);font-weight:600}
[dir=rtl] .eyebrow{letter-spacing:0}
.hero h1{font-size:clamp(40px,7vw,84px);line-height:1.02;margin:14px 0 18px;max-width:860px}
.hero h1 em{font-style:normal;background:var(--em);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:19px;color:var(--hsub);max-width:560px;line-height:1.6}
.sbar{text-shadow:none;margin-top:34px;background:var(--surf);color:var(--ink);border-radius:26px;padding:10px;display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:6px;max-width:960px;box-shadow:var(--sh)}
.sbar label{padding:10px 18px;display:block;border-inline-end:1px solid var(--line)}
.sbar label:nth-child(3){border:0}
.sbar small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
[dir=rtl] .sbar small{letter-spacing:0}
.sbar input,.sbar select{border:0;outline:0;background:none;font:inherit;font-size:16px;font-weight:500;width:100%;color:var(--ink);margin-top:3px}
.go{background:var(--btn);color:var(--btnink);border-radius:18px;padding:0 30px;font-weight:600;font-size:16px}
.go:hover{filter:brightness(1.1)}
.stats{display:flex;gap:48px;margin-top:40px;flex-wrap:wrap}
.stats b{display:block;font-family:Fraunces,serif;font-size:34px}.stats span{color:var(--hsub);font-size:14px}
/* sections */
section{padding:84px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:32px}
.head h2{font-size:clamp(30px,4vw,46px);line-height:1.1}.head p{color:var(--mut);margin-top:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:500;color:var(--ink)}
.chip.on{background:var(--btn);color:var(--btnink);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:26px}
.card{background:var(--surf);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:.3s}
.card:hover{transform:translateY(-6px);box-shadow:var(--sh)}
.ph{position:relative;height:230px;overflow:hidden}
.ph svg,.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:.6s}
.card:hover .ph svg,.card:hover .ph img{transform:scale(1.06)}
.badge{position:absolute;top:14px;inset-inline-start:14px;background:var(--glass);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600;display:flex;gap:6px;align-items:center}
.badge:before{content:"✓";color:#fff;background:#0f9d6b;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px}
.heart{position:absolute;top:12px;inset-inline-end:12px;width:38px;height:38px;border-radius:50%;background:var(--glass);font-size:18px;color:var(--mut)}
.heart.on{color:#e11d48}
.cb{padding:20px 22px 22px}
.price{font-family:Fraunces,serif;font-size:28px;font-weight:700}.price span{color:var(--gold)}
.cb h3{font-size:19px;margin:6px 0 4px;font-family:Inter,sans-serif;font-weight:600;letter-spacing:0}
[dir=rtl] .cb h3{font-family:Cairo}
.loc{color:var(--mut);font-size:14px}
.spec{display:flex;gap:18px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink)}
/* features */
.dark{background:var(--sec);color:var(--sect);position:relative;overflow:hidden}
.dark:before{content:"";position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(var(--glow),transparent 65%);top:-250px;inset-inline-end:-150px}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;position:relative}
.f{border:1px solid var(--fb);border-radius:var(--r);padding:30px;background:var(--fbg);box-shadow:var(--sh)}
.f .ic{width:52px;height:52px;border-radius:16px;background:var(--acc);display:grid;place-items:center;font-size:24px;color:var(--accink);margin-bottom:20px}
.f h3{font-size:22px;margin-bottom:10px}.f p{color:var(--fp);line-height:1.65}
/* ai */
.ai{display:grid;grid-template-columns:1fr 1.1fr;gap:50px;align-items:center}
.ai h2{font-size:clamp(30px,4vw,48px);line-height:1.1;margin-bottom:14px}.ai p{color:var(--mut);line-height:1.7}
.chat{background:var(--surf);border:1px solid var(--line);border-radius:28px;box-shadow:var(--sh);overflow:hidden}
.ch{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-weight:600}
.ch i{width:10px;height:10px;border-radius:50%;background:#0f9d6b}
#log{height:250px;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.m{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.6;font-size:15px}
.m.u{background:var(--btn);color:var(--btnink);align-self:flex-end;border-end-end-radius:4px}
.m.a{background:var(--sec);align-self:flex-start;border-end-start-radius:4px}
.sug{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 12px}.sug button{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--mut)}
.in{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}
.in input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:13px 16px;font:inherit;outline:0;background:var(--bg)}
.in button{flex:none;background:var(--acc);color:var(--accink);font-weight:700;border-radius:14px;padding:0 22px}
/* modal */
dialog{border:0;border-radius:28px;width:min(860px,94vw);padding:0;overflow:hidden;background:var(--surf);color:var(--ink);margin:auto}
dialog::backdrop{background:#1d1409b3;backdrop-filter:blur(6px)}
.dm{display:grid;grid-template-columns:1.2fr 1fr}.dm .ph{height:100%;min-height:420px}
.dd{padding:34px}.dd h2{font-size:30px;margin:8px 0}.dd .price{font-size:36px;margin:14px 0}
.sp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.sp div{background:var(--sec);border-radius:14px;padding:12px;text-align:center}.sp b{display:block;font-size:20px}.sp small{color:var(--mut)}
.btn{display:block;width:100%;border-radius:16px;padding:16px;font-weight:700;font-size:16px;margin-top:10px}
.x{position:absolute;top:14px;inset-inline-end:14px;width:40px;height:40px;border-radius:50%;background:var(--surf);color:var(--ink);z-index:3;font-size:18px}
footer{background:var(--ftr);color:var(--ftrc);padding:44px 0;font-size:14px}footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
#toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tbg);color:#fff;padding:14px 22px;border-radius:16px;display:none;z-index:99;font-weight:500;box-shadow:0 14px 34px #e55b0044}
@media(max-width:900px){.links{display:none}.sbar{grid-template-columns:1fr}.sbar label{border:0;border-bottom:1px solid var(--line)}.go{padding:16px}.fg,.ai,.dm{grid-template-columns:1fr}.dm .ph{min-height:260px}.hero{min-height:760px}}
@media(max-width:900px){.hero{min-height:0}.hero .wrap{padding-top:96px;padding-bottom:44px}section{padding:52px 0}
.stats{gap:22px;flex-wrap:nowrap;margin-top:28px}.stats b{font-size:26px}.stats span{font-size:12px}
.pill{padding:8px 13px;font-size:13px}.logo{font-size:22px}.logo i{width:30px;height:30px}.nr{gap:6px}
.sbar{border-radius:22px}.hero h1{font-size:40px}.head h2{font-size:30px}}
input::placeholder{color:#a8693a;opacity:1}[data-theme=dark] input::placeholder{color:#8fb9bb}
footer{padding-bottom:calc(44px + env(safe-area-inset-bottom,0px) + 80px)}
html{-webkit-text-size-adjust:100%}body{overflow-x:clip}img,svg{max-width:100%}
.ls{display:none}.pi{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.logo{flex:none}.nr{min-width:0}
@media(max-width:600px){nav .wrap{height:62px}.lf{display:none}.ls{display:inline}.hero .wrap{padding-top:88px}}
@media(max-width:400px){.wrap{padding-inline:16px}.logo{font-size:19px}.logo i{width:26px;height:26px;font-size:15px}.pill{padding:7px 10px;font-size:12px}.nr{gap:4px}.pi{max-width:118px}.hero h1{font-size:34px}}
@media(min-width:601px) and (max-width:900px){.sbar{grid-template-columns:1fr 1fr}.sbar label{border:0}.go{grid-column:1/-1}.fg{grid-template-columns:1fr 1fr}.hero h1{font-size:54px}}
@media(min-width:1500px){.wrap{max-width:1360px}.hero h1{font-size:92px}.hero .wrap{padding-top:130px}}
.tabs{display:none}
@media(max-width:900px){
.tabs{display:flex;position:fixed;inset:auto 0 0;z-index:60;background:var(--nvbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px) + var(--sb,0px))}
.tabs button{flex:1;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:6px 0;border-radius:12px}
.tabs button i{font-style:normal;font-size:20px;line-height:1}
.tabs button.on{color:var(--gold)}
footer{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(130px + var(--sb,0px) + env(safe-area-inset-bottom,0px))}}
section{scroll-margin-top:76px}.chat{scroll-margin-top:86px}
.rows{display:grid;gap:8px;margin:18px 0}.row{display:flex;justify-content:space-between;align-items:center;background:var(--sec);color:var(--ink);border-radius:14px;padding:14px 16px;font-weight:600;font-size:15px;width:100%}
.fm{display:grid;gap:10px}.fm input,.fm select{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit;width:100%;min-width:0;outline:0}
.two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#pg{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}#pg.on{display:block}
.pgbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--nvbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.pgbar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--surf);color:var(--ink);border:1px solid var(--line);font-size:18px;flex:none}.ib.on{color:#e11d48}
.pgw{max-width:1180px;margin:auto;padding:16px 16px calc(130px + var(--sb,0px))}
.gal{position:relative;border-radius:24px;overflow:hidden;background:var(--sec)}
.trk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:3/2;max-height:580px;width:100%}.trk::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;cursor:zoom-in;position:relative}.sl>svg,.sl>img{width:100%;height:100%;object-fit:cover;display:block}
.sl span,.cnt{position:absolute;background:#000b;color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}.sl span{bottom:12px;inset-inline-start:12px}.cnt{top:12px;inset-inline-end:12px;z-index:2}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:var(--glass);color:var(--ink);font-size:20px;z-index:2}.arr.p{inset-inline-start:12px}.arr.n{inset-inline-end:12px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.thumbs button{flex:none;width:96px;aspect-ratio:3/2;border-radius:12px;overflow:hidden;border:2px solid transparent;padding:0;opacity:.65;background:none}.thumbs button.on{border-color:var(--gold);opacity:1}.thumbs svg,.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.note{font-size:12px;color:var(--mut)}
.pgcols{display:grid;grid-template-columns:1fr 360px;gap:32px;margin-top:18px;align-items:start}
.pgmain h1{font-size:clamp(28px,4vw,42px);line-height:1.1}.pgmain h3{font-size:22px;margin:28px 0 10px}.pgmain p{line-height:1.75;color:var(--mut)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:20px 0}.facts div{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px}.facts b{display:block;font-size:20px;font-family:Fraunces,serif}.facts small{color:var(--mut)}
.am{display:flex;flex-wrap:wrap;gap:8px}.am span{background:var(--sec);color:var(--ink);border-radius:999px;padding:9px 15px;font-weight:600;font-size:14px}
.map{position:relative;height:210px;border-radius:20px;overflow:hidden;border:1px solid var(--line)}.map svg{width:100%;height:100%;display:block}.map div{position:absolute;inset:auto 12px 12px;background:var(--glass);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600}
.owner{display:flex;gap:14px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:16px}
.buybox{position:sticky;top:84px;background:var(--surf);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--sh)}.buybox .price{font-size:38px}
.sim{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}.sim .card .ph{height:150px}
.pgcta{display:none}
#lb{position:fixed;inset:0;z-index:120;background:#000e;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}#lb.on{display:flex}
#lbi{width:min(96vw,1000px);aspect-ratio:3/2;border-radius:16px;overflow:hidden}#lbi svg,#lbi img{width:100%;height:100%;object-fit:contain;display:block}
#lb .ib{position:absolute;background:#ffffff22;color:#fff;border-color:#ffffff33}#lbc{color:#fff;font-weight:600}
@media(max-width:900px){.pgcols{grid-template-columns:1fr}.buybox{display:none}.arr{display:none}.trk{aspect-ratio:4/3}.thumbs button{width:76px}
.pgcta{display:flex;position:fixed;inset:auto 0 0;z-index:90;background:var(--nvbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px) + var(--sb,0px));gap:12px;align-items:center}.pgcta .price{font-size:24px;flex:1}.pgcta .btn{width:auto;margin:0;padding:14px 22px}}
</style>
</head>
<body>
<nav><div class="wrap">
  <div class="logo"><i>F</i>Forsale</div>
  <div class="links"><a href="#browse" data-i="n1"></a><a href="#why" data-i="n2"></a><a href="#" id="navSell" data-i="n4"></a><a href="#ai" data-i="n3"></a></div>
  <div class="nr"><button class="pill glass" id="theme" title="Theme">🌙</button><button class="pill glass" id="lang"><span class="lf">العربية</span><span class="ls">ع</span></button><button class="pill pi" id="login" data-i="login"></button></div>
</div></nav>

<header class="hero">
  <svg class="bg" id="heroBg" preserveAspectRatio="xMidYMid slice"></svg>
  <div class="wrap">
    <span class="eyebrow">● <span data-i="eyebrow"></span></span>
    <h1 data-i="h1"></h1>
    <p data-i="sub"></p>
    <div class="sbar">
      <label><small data-i="where"></small><input id="q" data-ph="wph"></label>
      <label><small data-i="type"></small><select id="t"><option value="" data-i="any"></option><option value="apt" data-i="apt"></option><option value="villa" data-i="villa"></option><option value="com" data-i="com"></option><option value="land" data-i="land"></option></select></label>
      <label><small data-i="budget"></small><select id="p"><option value="0" data-i="anyp"></option><option value="150000">≤ 150,000 π</option><option value="500000">≤ 500,000 π</option><option value="1000000">≤ 1,000,000 π</option></select></label>
      <button class="go" id="go" data-i="search"></button>
    </div>
    <div class="stats"><div><b>π</b><span data-i="s1"></span></div><div><b>AI</b><span data-i="s2"></span></div><div><b>EN · AR</b><span data-i="s3"></span></div></div>
  </div>
</header>

<section id="browse"><div class="wrap">
  <div class="head"><div><h2 data-i="feat"></h2><p data-i="featp"></p></div>
  <div class="chips" id="chips"></div></div>
  <div class="grid" id="grid"></div>
</div></section>

<section class="dark" id="why"><div class="wrap">
  <div class="head"><div><h2 data-i="why"></h2></div></div>

const AM={en:{elev:'Elevator',sec:'24/7 security',park:'Parking',view:'City view',smart:'Smart home',pool:'Private pool',sea:'Sea view',garden:'Garden',balc:'Balcony',ac:'Central A/C',road:'Road access',util:'Utilities nearby'},ar:{elev:'مصعد',sec:'أمن على مدار الساعة',park:'مواقف سيارات',view:'إطلالة على المدينة',smart:'منزل ذكي',pool:'مسبح خاص',sea:'إطلالة بحرية',garden:'حديقة',balc:'شرفة',ac:'تكييف مركزي',road:'وصول مباشر للطريق',util:'مرافق قريبة'}};
const TYN={apt:'apt',villa:'villa',com:'com',land:'land'};
function room(l,k,u){const [a,b,c,d]=PAL[l.pal],W=600,H=400;
 let s=`<defs><linearGradient id="${u}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".7" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="#FFF8F1"/><rect y="292" width="${W}" height="108" fill="#EBD5BD"/><rect y="288" width="${W}" height="6" fill="#D7BC9F"/>`;
 const win=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${u}s)" stroke="#fff" stroke-width="8"/><circle cx="${x+w*.72}" cy="${y+h*.45}" r="${h*.13}" fill="#FFB02E"/><rect x="${x+w/2-2}" y="${y}" width="4" height="${h}" fill="#fff"/>`;
 if(k==='living')s+=win(60,50,230,170)+`<rect x="335" y="70" width="90" height="120" rx="6" fill="${d}" opacity=".35"/><rect x="445" y="95" width="90" height="80" rx="6" fill="${b}" opacity=".6"/><ellipse cx="300" cy="364" rx="200" ry="24" fill="${d}" opacity=".25"/><rect x="110" y="262" width="380" height="50" rx="16" fill="${d}"/><rect x="90" y="250" width="44" height="66" rx="14" fill="${d}"/><rect x="466" y="250" width="44" height="66" rx="14" fill="${d}"/><rect x="132" y="224" width="336" height="48" rx="16" fill="${d}" opacity=".85"/><rect x="250" y="322" width="100" height="24" rx="8" fill="#fff" stroke="#D7BC9F"/><rect x="552" y="190" width="6" height="106" fill="#8a6a4a"/><ellipse cx="555" cy="186" rx="26" ry="16" fill="#FFD36B"/>`;
 else if(k==='bed')s+=win(350,50,200,160)+`<rect x="60" y="130" width="250" height="90" rx="10" fill="${d}" opacity=".5"/><rect x="50" y="220" width="280" height="90" rx="14" fill="#fff"/><rect x="50" y="250" width="280" height="62" rx="10" fill="${d}"/><rect x="70" y="205" width="90" height="34" rx="12" fill="#FFE9D6"/><rect x="190" y="205" width="90" height="34" rx="12" fill="#FFE9D6"/><rect x="345" y="248" width="60" height="62" rx="6" fill="#C49A6C"/><rect x="415" y="264" width="150" height="14" rx="7" fill="${d}" opacity=".4"/><ellipse cx="300" cy="366" rx="210" ry="22" fill="${d}" opacity=".2"/>`;
 else if(k==='kitchen')s+=`<rect x="30" y="40" width="540" height="90" rx="8" fill="${d}" opacity=".85"/>`+[0,1,2,3,4].map(i=>`<rect x="${42+i*106}" y="50" width="94" height="70" rx="4" fill="#fff" opacity=".35"/>`).join('')+`<rect x="30" y="196" width="540" height="96" fill="${d}"/><rect x="24" y="186" width="552" height="14" fill="#fff"/><rect x="230" y="150" width="140" height="6" fill="#444"/><rect x="120" y="262" width="360" height="50" rx="6" fill="#fff"/><rect x="110" y="250" width="380" height="14" rx="6" fill="#E8D6C2"/>`+[170,300,430].map(x=>`<line x1="${x}" y1="0" x2="${x}" y2="40" stroke="#444" stroke-width="2"/><ellipse cx="${x}" cy="48" rx="20" ry="12" fill="#FFD36B"/>`).join('');
 else if(k==='bath')s+=`<rect width="${W}" height="288" fill="#EAF6F4"/>`+Array.from({length:12},(_,i)=>`<line x1="${i*50}" y1="0" x2="${i*50}" y2="288" stroke="#fff" stroke-width="2"/>`).join('')+`<rect x="60" y="60" width="130" height="170" rx="10" fill="${a}" stroke="#fff" stroke-width="8"/><circle cx="125" cy="145" r="34" fill="${c}" opacity=".7"/><rect x="250" y="210" width="300" height="86" rx="40" fill="#fff" stroke="#CFE3E0" stroke-width="3"/><rect x="262" y="222" width="276" height="50" rx="26" fill="${a}" opacity=".35"/><rect x="460" y="130" width="8" height="80" fill="#B5C6C3"/><rect x="380" y="130" width="90" height="8" rx="4" fill="#B5C6C3"/>`;
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">${s}</svg>`}
function viewImg(l,u){let r='';for(let i=0;i<21;i++)r+=`<rect x="${i*30}" y="340" width="3" height="60" fill="#fff" opacity=".85"/>`;return scene(l,600,400,u).replace('</svg>',`<rect y="332" width="600" height="8" fill="#fff"/>${r}</svg>`)}
function photosOf(l,u){
 if(l.photos&&l.photos.length)return l.photos.map(x=>({lab:'',h:`<img src="${esc(x)}" alt="" loading="lazy">`}));
 const K=l.ty==='land'?['ext','ext2','aer']:l.ty==='com'?['ext','lobby','view','ext2']:['ext','liv','kit','bed','bat','view'];
 return K.map((k,i)=>{const id=u+i;const h=k==='ext'?scene(l,600,400,id):k==='ext2'||k==='aer'?scene({...l,id:l.id+7*(i+1)},600,400,id):k==='view'?viewImg(l,id):room(l,k==='lobby'?'living':k==='liv'?'living':k==='kit'?'kitchen':k==='bed'?'bed':'bath',id);
  return {lab:T('ph_'+(k==='ext2'?'ext':k)),h}})}
function desc(x){const c=x.c[lang],a=fmt(x.a);const D={en:{apt:`Bright ${a} m² apartment with ${x.b} bedrooms and ${x.ba} bathrooms in ${c}.`,villa:`Spacious ${a} m² villa with ${x.b} bedrooms and ${x.ba} bathrooms in ${c}.`,com:`Prime ${a} m² commercial space in ${c}.`,land:`${a} m² investment land plot in ${c}.`},ar:{apt:`شقة مشرقة بمساحة ${a} م² و${x.b} غرف نوم و${x.ba} حمامات في ${c}.`,villa:`فيلا واسعة بمساحة ${a} م² و${x.b} غرف نوم و${x.ba} حمامات في ${c}.`,com:`مساحة تجارية مميزة بمساحة ${a} م² في ${c}.`,land:`قطعة أرض استثمارية بمساحة ${a} م² في ${c}.`}};return esc(D[lang][x.ty])}
let lbList=[],lbI=0;
function lbShow(i){lbI=(i+lbList.length)%lbList.length;$('lbi').innerHTML=lbList[lbI].h.replace(/id="([^"]+)"/g,'id="L$1"').replace(/url\(#([^)]+)\)/g,'url(#L$1)');$('lbc').textContent=(lbI+1)+' / '+lbList.length+(lbList[lbI].lab?' · '+lbList[lbI].lab:'')}
function lbOpen(i){$('lb').classList.add('on');lbShow(i)}
$('lbx').onclick=()=>$('lb').classList.remove('on');$('lbp').onclick=()=>lbShow(lbI-1);$('lbn').onclick=()=>lbShow(lbI+1);
let tx=0;$('lb').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});$('lb').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)lbShow(lbI+(d<0?1:-1))});
addEventListener('keydown',e=>{if($('lb').classList.contains('on')){if(e.key==='Escape')$('lb').classList.remove('on');if(e.key==='ArrowRight')lbShow(lbI+1);if(e.key==='ArrowLeft')lbShow(lbI-1)}});
function showPg(id){const x=L.find(v=>v.id===id);if(!x){return hidePg()}
 window.curPg=id;const ph=photosOf(x,'p'+id+'_'),n=ph.length,fav=favs.has(id),am=x.am||AMS[x.id]||[],sim=L.filter(v=>v.id!==id).slice(0,3);lbList=photosOf(x,'q'+id+'_');
 const ppm=x.a?fmt(Math.round(x.p/x.a)):'—',own=x.mine?'@'+esc(user?user.username:'you'):T('sowner');
 const buy=`<button class="btn" style="background:var(--btn);color:var(--btnink)" onclick="buy(${id})">π ${T('buy')}</button>`;
 $('pg').innerHTML=`<div class="pgbar"><button class="ib" id="pgBack" aria-label="${T('back')}">${lang==='ar'?'→':'←'}</button><b>${esc(x.t[lang])}</b><button class="ib" id="pgShare" aria-label="${T('share')}">⤴</button><button class="ib ${fav?'on':''}" id="pgFav" aria-label="Save">♥</button></div>
 <div class="pgw"><div class="gal"><div class="cnt" id="cnt">1 / ${n}</div><button class="arr p" id="aP">‹</button><button class="arr n" id="aN">›</button><div class="trk" id="trk">${ph.map((p,i)=>`<div class="sl" data-i="${i}">${p.h}${p.lab?`<span>${p.lab}</span>`:''}</div>`).join('')}</div></div>
 <div class="thumbs" id="thumbs">${ph.map((p,i)=>`<button class="${i?'':'on'}" data-i="${i}">${p.h.replace(/id="([^"]+)"/g,'id="T$1"').replace(/url\(#([^)]+)\)/g,'url(#T$1)')}</button>`).join('')}</div>
 <div class="note">${x.photos?'':T('illus')}</div>
 <div class="pgcols"><div class="pgmain"><span class="badge" style="position:static;display:inline-flex">${T('verified')}</span><h1 style="margin-top:10px">${esc(x.t[lang])}</h1><div class="loc" style="margin-top:6px">📍 ${esc(x.c[lang])}</div>
 <div class="facts">${x.b?`<div><b>${x.b}</b><small>${T('beds')}</small></div>`:''}${x.ba?`<div><b>${x.ba}</b><small>${T('baths')}</small></div>`:''}<div><b>${fmt(x.a)}</b><small>${T('area')}</small></div><div><b>${T(TYN[x.ty])}</b><small>${T('ptype')}</small></div><div><b>${ppm} π</b><small>${T('ppm')}</small></div></div>
 <h3>${T('about')}</h3><p>${desc(x)}</p><p class="note">${T('noteS')}</p>
 ${am.length?`<h3>${T('feats')}</h3><div class="am">${am.map(a=>`<span>✓ ${AM[lang][a]}</span>`).join('')}</div>`:''}
 <h3>${T('locn')}</h3><div class="map"><svg viewBox="0 0 600 210" preserveAspectRatio="xMidYMid slice"><rect width="600" height="210" fill="#FFF4E6"/>${Array.from({length:10},(_,i)=>`<line x1="${i*70}" y1="0" x2="${i*70-60}" y2="210" stroke="#FFE2C4" stroke-width="10"/>`).join('')}<path d="M0 150 Q150 90 300 130 T600 90" stroke="#BFE6F0" stroke-width="26" fill="none"/><circle cx="300" cy="100" r="28" fill="#E55B00" opacity=".18"/><path d="M300 118 l-14 -26 a16 16 0 1 1 28 0z" fill="#E55B00"/><circle cx="300" cy="88" r="6" fill="#fff"/></svg><div>📍 ${esc(x.c[lang])} · ${T('mapsoon')}</div></div>
 <h3>${T('seller')}</h3><div class="owner"><div style="width:48px;height:48px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;font-weight:800">${x.mine?'@':'S'}</div><div><b>${own}</b><div class="loc">${T('vsoon')}</div></div></div></div>
 <aside class="pgside"><div class="buybox"><small class="loc">${T('priceL')||''}</small><div class="price">${fmt(x.p)} <span>π</span></div>${buy}<button class="btn" style="background:var(--sec);color:var(--ink)" onclick="toast(T('soon'))">${T('offer')}</button><button class="btn" style="background:var(--sec);color:var(--ink)" onclick="toast(T('soon'))">${T('contact')}</button></div></aside></div>
 <h3 class="serif" style="font-size:26px;margin:36px 0 14px">${T('similar')}</h3><div class="sim">${sim.map(v=>`<article class="card" data-id="${v.id}"><div class="ph">${scene(v,400,260,'s'+id+'_'+v.id)}</div><div class="cb"><div class="price">${fmt(v.p)} <span>π</span></div><h3>${esc(v.t[lang])}</h3><div class="loc">📍 ${esc(v.c[lang])}</div></div></article>`).join('')}</div></div>
 <div class="pgcta"><div class="price">${fmt(x.p)} <span>π</span></div>${buy}</div>`;
 const g=q=>$('pg').querySelector(q),trk=g('#trk'),th=[...$('pg').querySelectorAll('#thumbs button')],dir=document.documentElement.dir==='rtl'?-1:1;
 const idx=()=>Math.round(Math.abs(trk.scrollLeft)/Math.max(trk.clientWidth,1)),to=i=>trk.scrollTo({left:dir*Math.max(0,Math.min(n-1,i))*trk.clientWidth,behavior:'smooth'});
 trk.addEventListener('scroll',()=>{const i=idx();g('#cnt').textContent=(i+1)+' / '+n;th.forEach((b,j)=>b.classList.toggle('on',j===i))},{passive:true});
 th.forEach(b=>b.onclick=()=>to(+b.dataset.i));g('#aP').onclick=()=>to(idx()-1);g('#aN').onclick=()=>to(idx()+1);
 trk.onclick=e=>{const sl=e.target.closest('.sl');if(sl)lbOpen(+sl.dataset.i)};
 g('#pgBack').onclick=()=>{if(window._fromCard)history.back();else{history.replaceState(null,'',location.pathname+location.search);route()}};
 g('#pgFav').onclick=e=>{favs.has(id)?favs.delete(id):favs.add(id);e.currentTarget.classList.toggle('on',favs.has(id));render()};
 g('#pgShare').onclick=async()=>{const u=location.href;try{if(navigator.share)await navigator.share({title:x.t.en,url:u});else{await navigator.clipboard.writeText(u);toast(T('copied'))}}catch(e){}};
 $('pg').querySelectorAll('.sim .card').forEach(c=>c.onclick=()=>{location.hash='p'+c.dataset.id});
 $('pg').classList.add('on');document.body.style.overflow='hidden';$('pg').scrollTop=0}
function hidePg(){window.curPg=null;window._fromCard=false;$('pg').classList.remove('on');$('lb').classList.remove('on');document.body.style.overflow=''}
function route(){const m=/^#p(\d+)$/.exec(location.hash);m?showPg(+m[1]):hidePg()}
addEventListener('hashchange',route);

/* Account sheet */
function openAcc(){
 $('accb').innerHTML=`<div style="display:flex;gap:14px;align-items:center"><div style="width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;font-size:24px;font-weight:800">${user?esc(user.username.charAt(0).toUpperCase()):'π'}</div><div><b style="font-size:19px">${user?'@'+esc(user.username):T('guest')}</b><div class="loc">${user?T('conn'):T('notconn')}</div></div></div>
 ${user?'':`<button class="btn" style="background:var(--btn);color:var(--btnink)" id="aLogin">π ${T('signin')}</button>`}
 <div class="rows"><button class="row" id="aSaved"><span>♥ ${T('saved')}</span><b>${favs.size}</b></button><button class="row" id="aSell"><span>🏷 ${T('sell')}</span><b>›</b></button>
 <button class="row" id="aLang"><span>🌐 ${T('lang')}</span><b>${lang==='ar'?'English':'العربية'}</b></button><button class="row" id="aTheme"><span>🌓 ${T('theme')}</span><b>${theme==='dark'?'☀️':'🌙'}</b></button></div>
 <button class="btn" style="background:var(--sec);color:var(--ink)" onclick="acc.close()">${T('close')}</button>`;
 const g=id=>$(id);
 if(g('aLogin'))g('aLogin').onclick=()=>{acc.close();$('login').click()};
 g('aSaved').onclick=()=>{acc.close();onlyFav=true;render();if(!favs.size)toast(T('nosaved'));mark('saved');$('browse').scrollIntoView({behavior:'smooth'})};
 g('aSell').onclick=()=>{acc.close();openSell()};
 g('aLang').onclick=()=>{$('lang').click();openAcc()};
 g('aTheme').onclick=()=>{$('theme').click();openAcc()};
 acc.showModal()}
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));

/* AI */
async function ask(q){if(!q)return;const lg=$('log');lg.innerHTML+=`<div class="m u">${q.replace(/</g,'&lt;')}</div>`;$('aq').value='';
 try{const r=await fetch('/api/ai',J({q,listings:L.map(x=>({id:x.id,title:x.t.en,city:x.c.en,type:x.ty,price_pi:x.p,beds:x.b,area:x.a}))}));const d=await r.json();lg.innerHTML+=`<div class="m a">${d.text.replace(/</g,'&lt;')}</div>`}
 catch(e){lg.innerHTML+=`<div class="m a">${T('err')}</div>`}lg.scrollTop=1e9}
$('send').onclick=()=>ask($('aq').value.trim());
$('aq').onkeydown=e=>{if(e.key==='Enter')ask(e.target.value.trim())};
$('sug').onclick=e=>{if(e.target.tagName==='BUTTON')ask(e.target.textContent)};
const tabBtns=document.querySelectorAll('#tabs button');
const mark=k=>tabBtns.forEach(b=>b.classList.toggle('on',b.dataset.go===k));
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.go,go=(id)=>$(id).scrollIntoView({behavior:'smooth'});
 if(k==='home'){onlyFav=false;render();scrollTo({top:0,behavior:'smooth'})}
 else if(k==='explore'){onlyFav=false;render();go('browse')}
 else if(k==='ai'){go('chat')}
 else if(k==='saved'){onlyFav=true;render();if(!favs.size)toast(T('nosaved'));go('browse')}
 else if(k==='acct'){openAcc()}
 if(k!=='acct')mark(k)};
addEventListener('scroll',()=>{if(onlyFav)return;const a=$('ai').getBoundingClientRect().top,b=$('browse').getBoundingClientRect().top;mark(a<innerHeight*.5?'ai':b<innerHeight*.5?'explore':'home')},{passive:true});
mark('home');
if(/PiBrowser|; wv\)/i.test(navigator.userAgent))document.documentElement.style.setProperty('--sb','44px');
setTheme(theme);applyLang();route();
</script>
</body></html>
